<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Address Details</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Segoe UI", Arial, sans-serif;

      background:
        linear-gradient(
          rgba(255,255,255,0.15),
          rgba(255,255,255,0.15)
        ),
        url("background.png") center center / cover no-repeat fixed;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    /* MAIN CARD */

    .card {

      width: 100%;
      max-width: 520px;

      background: rgba(255,255,255,0.96);

      border-radius: 22px;

      padding: 28px 25px 25px;

      text-align: center;

      box-shadow:
        0 15px 45px rgba(0,0,0,0.30);

      backdrop-filter: blur(8px);

      animation: cardIn 0.6s ease;
    }

    @keyframes cardIn {

      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* RAJDHANI LOGO */

    .company-logo {

      width: 155px;
      max-width: 65%;

      height: auto;

      margin: 0 auto 10px;

      display: block;

      animation: logoIn 0.7s ease;
    }

    @keyframes logoIn {

      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* TITLE */

    h2 {

      margin: 5px 0 10px;

      font-size: 21px;

      color: #b30000;

      letter-spacing: 1px;

      font-weight: 800;
    }


    /* CODE */

    .code-box {

      display: inline-block;

      background:
        linear-gradient(
          135deg,
          #ff3c2b,
          #ff416c
        );

      color: white;

      padding: 6px 18px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 13px;

      box-shadow:
        0 4px 12px rgba(255,60,43,0.25);
    }


    /* ADDRESS */

    .address-box {

      font-size: 16px;

      line-height: 1.55;

      color: #222;

      text-align: center;

      margin: 0 auto;

      max-width: 460px;

      font-weight: 500;
    }

    .address-box br {
      line-height: 1.4;
    }


    /* FSSAI */

    .fssai-section {

      margin-top: 8px;

      display: flex;

      flex-direction: column;

      align-items: center;
    }

    .fssai-logo {

      width: 82px;

      height: auto;

      display: block;

      margin: 0 auto 2px;
    }


    /* LICENSE */

    .license {

      margin-top: 0;

      font-size: 14px;

      font-weight: 700;

      color: #b30000;

      line-height: 1.3;
    }


    /* BACK BUTTON */

    .back-btn {

      margin-top: 17px;

      padding: 10px 24px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #ff3c2b,
          #ff416c
        );

      color: white;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(255,60,43,0.25);

      transition: 0.25s;
    }

    .back-btn:hover {

      transform: translateY(-2px);

      box-shadow:
        0 8px 18px rgba(255,60,43,0.35);
    }


    /* MOBILE */

    @media (max-width: 600px) {

      body {

        padding: 12px;

        background-attachment: scroll;

      }

      .card {

        max-width: 100%;

        padding: 22px 17px 20px;

        border-radius: 18px;
      }

      .company-logo {

        width: 135px;

        margin-bottom: 7px;
      }

      h2 {

        font-size: 19px;

        margin-bottom: 8px;
      }

      .code-box {

        font-size: 12px;

        padding: 5px 15px;

        margin-bottom: 11px;
      }

      .address-box {

        font-size: 15px;

        line-height: 1.5;

        padding: 0 3px;
      }

      .fssai-section {

        margin-top: 6px;
      }

      .fssai-logo {

        width: 72px;

        margin-bottom: 1px;
      }

      .license {

        font-size: 13px;
      }

      .back-btn {

        margin-top: 14px;

        padding: 9px 22px;

        font-size: 13px;
      }

    }


    /* VERY SMALL PHONES */

    @media (max-width: 380px) {

      .card {

        padding: 20px 14px 18px;
      }

      .company-logo {

        width: 120px;
      }

      h2 {

        font-size: 18px;
      }

      .address-box {

        font-size: 14px;

        line-height: 1.45;
      }

    }

  </style>

</head>


<body>


<div class="card">


  <!-- RAJDHANI LOGO -->
  <img
    src="logo.png"
    class="company-logo"
    id="companyLogo"
    alt="Company Logo"
  >


  <h2>ADDRESS DETAILS</h2>


  <div
    class="code-box"
    id="codeBox">
  </div>

    class="address-box"

  <!-- FSSAI -->
  <div class="fssai-section">

    <img

    <div

  <!-- BACK -->
  <button

</html>
