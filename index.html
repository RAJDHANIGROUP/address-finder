<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Address Finder</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      background:
        linear-gradient(
          135deg,
          #ff3b30,
          #ff416c,
          #ff9f43
        );

      overflow: hidden;
    }


    /* MAIN BOX */

    .box {

      position: relative;

      width: 100%;

      max-width: 430px;

      background:
        rgba(255,255,255,0.97);

      padding: 42px 28px 32px;

      border-radius: 22px;

      text-align: center;

      box-shadow:
        0 18px 45px
        rgba(0,0,0,0.25);

      animation:
        boxIn 0.7s ease;
    }


    @keyframes boxIn {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(0.95);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* ADDRESS FINDER */

    .animated-title {

      font-size: 42px;

      font-weight: 900;

      line-height: 1.05;

      margin: 0 0 28px;

      letter-spacing: 1.5px;

      background:
        linear-gradient(
          90deg,
          #ff0000,
          #ff9900,
          #ff0000,
          #ff416c
        );

      background-size: 400% 400%;

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      animation:
        gradientMove 4s linear infinite,
        titlePulse 2.5s ease-in-out infinite;
    }


    @keyframes gradientMove {

      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 100% 50%;
      }

    }


    @keyframes titlePulse {

      0%,
      100% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.06);

      }

    }


    /* ENTER CODE */

    h3 {

      color: #333;

      font-size: 16px;

      margin-bottom: 13px;

    }


    /* INPUT */

    input {

      width: 100%;

      max-width: 260px;

      height: 48px;

      padding: 10px 15px;

      border:

        2px solid #ddd;

      border-radius: 12px;

      text-align: center;

      font-size: 17px;

      text-transform: uppercase;

      outline: none;

      transition: 0.25s;

    }


    input:focus {

      border-color:
        #ff416c;

      box-shadow:
        0 0 0 4px
        rgba(255,65,108,0.12);

    }


    /* BUTTON */

    button {

      width: 100%;

      max-width: 260px;

      height: 48px;

      margin-top: 15px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #ff3b30,
          #ff416c
        );

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 7px 18px
        rgba(255,60,43,0.25);

      transition: 0.25s;

    }


    button:hover {

      transform:
        translateY(-2px);

    }


    /* SMALL INFORMATION */

    .footer {

      margin-top: 18px;

      font-size: 11px;

      color: #999;

    }


    /* BABA ZONE AI */

    .creator {

      position: fixed;

      right: 12px;

      bottom: 10px;

      font-size: 9px;

      color: white;

      text-align: right;

      line-height: 1.25;

      opacity: 0.85;

      z-index: 10;

    }


    .creator span {

      display: block;

      font-weight: 700;

      letter-spacing: 0.8px;

    }


    /* MOBILE */

    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .box {

        max-width: 350px;

        padding:
          38px 22px 28px;

        border-radius: 20px;

      }


      .animated-title {

        font-size: 34px;

        margin-bottom: 25px;

      }


      h3 {

        font-size: 15px;

      }


      input,
      button {

        max-width: 240px;

      }


      .creator {

        right: 9px;

        bottom: 7px;

        font-size: 8px;

      }

    }


    /* VERY SMALL PHONE */

    @media (max-width: 380px) {

      .box {

        max-width: 330px;

        padding:
          32px 18px 25px;

      }


      .animated-title {

        font-size: 30px;

      }


      input,
      button {

        max-width: 220px;

      }

    }

  </style>

</head>


<body>


<div class="box">


  <h1 class="animated-title">
    ADDRESS FINDER
  </h1>


  <h3>
    Enter Code
  </h3>


  <input
    type="text"
    id="code"
    maxlength="2"
    placeholder="Enter Code"
    autocomplete="off"
  >


  <br>


  <button onclick="goNext()">
    Search Address
  </button>


  <div class="footer">
    Enter your code to view address details
  </div>


</div>


<!-- BABA ZONE AI -->

<div class="creator">

  Created By

  <span>
    BABA ZONE AI
  </span>

</div>


<script>


function goNext() {

  var code =
    document
      .getElementById("code")
      .value
      .toUpperCase()
      .trim();


  if (code === "") {

    alert("Please enter code");

    return;

  }


  window.location.href =
    "result.html?code=" +
    encodeURIComponent(code);

}


</script>


</body>

</html>
